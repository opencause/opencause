services:
  guild:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: https://npkozldwxhkhiuxmwbua.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wa296bGR3eGhraGl1eG13YnVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNTk4NjYsImV4cCI6MjA4NTczNTg2Nn0.pvn3Z-Osncx-13zpbx_UX2_da6QuGm3FmDTffjMdhMo
        VITE_API_URL: https://opencause.ai
    container_name: guild
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - FRONTEND_URL=https://opencause.ai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
